---
$schema: https://json-schema.org/schema#
$id: https://calamares.io/schemas/zfs
additionalProperties: false
type: object
properties:
    poolName: { type: string }
    poolOptions: { type: string }
    datasetOptions: { type: string }
    grubCompatibility: { type: string, enum: [grub2, grub2-2.06, grub2-2.12] }
    utf8Only: { type: boolean, default: false }
    poolNames:
        type: object
        propertyNames: { pattern: '^/' }
        additionalProperties: { type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_.:-]*$' }
    datasets:
        type: array
        items:
            type: object
            additionalProperties: false
            properties:
                dsName:  { type: string }
                mountpoint:  { type: string }
                # Nominally a string, but "on" and "off" are valid and get
                # turned into a boolean in the YAML parser.
                canMount:  { anyOf: [ { type: string }, { type: boolean } ] }
                properties:
                    type: object
                    additionalProperties: { type: string }
            required: [ dsName, mountpoint, canMount ]
required: [ poolName, datasets ]
