---
$schema: http://json-schema.org/draft-07/schema#
type: object
additionalProperties: false
properties:
    operation: { enum: [create, configure, deactivate] }
    emergency: { type: boolean }
    raid1:
        type: object
        additionalProperties: false
        required: [name]
        properties:
            name: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}$' }
            bitmap: { type: boolean }
            writeMostly: { type: boolean }
    lvm:
        type: object
        additionalProperties: false
        required: [volumeGroup, logicalVolume]
        properties:
            volumeGroup: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}$' }
            logicalVolume: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,31}$' }
            sizeMiB: { type: integer, minimum: 64 }
    encryption: { enum: [native, luks, both] }
    initramfs: { enum: [none, dracut] }
