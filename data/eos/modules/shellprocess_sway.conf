#
# adding greetd config if sway is installed
---

dontChroot: false

# Enable detailed logging for better debugging.
verbose: true

script:
  - "/etc/calamares/scripts/sway_greetd_config"
  - "cp /usr/share/eos-settings-sway/override.conf /etc/systemd/system/swayosd-libinput-backend.service.d/override.conf"

i18n:
  name: "adding greetd config if sway is installed"
